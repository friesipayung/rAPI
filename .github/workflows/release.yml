name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Only one release build at a time; a newer tag supersedes a queued one.
# Ordinary pushes to main never reach this workflow — it is tag-only by design,
# so pushing fixes/docs does not burn a build (version-tag.yml is the sole
# tag producer and only fires on internal/version/version.go bumps).
concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  linux-deb:
    name: Linux (deb, amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK4 + WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev build-essential pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version: .*/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml && rm -f build/linux/nfpm/nfpm.yaml.bak
          sed -i.bak "s/^  version: .*/  version: \"${VERSION}\"/" build/config.yml && rm -f build/config.yml.bak

      - name: Build deb package
        run: wails3 task linux:create:deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapi-linux-deb
          path: bin/*.deb
          if-no-files-found: error

  linux-appimage:
    name: Linux (AppImage, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK4 + WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev build-essential pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^  version: .*/  version: \"${VERSION}\"/" build/config.yml && rm -f build/config.yml.bak

      - name: Build AppImage
        run: wails3 task linux:create:appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapi-linux-appimage
          path: bin/*.AppImage
          if-no-files-found: error

  macos-app:
    name: macOS (universal .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^  version: .*/  version: \"${VERSION}\"/" build/config.yml && rm -f build/config.yml.bak

      - name: Build universal .app bundle
        run: wails3 task darwin:package:universal

      - name: Zip .app bundle
        run: |
          cd bin
          zip -ry rapi-macos-universal.zip rapi.app
          shasum -a 256 rapi-macos-universal.zip > rapi-macos-universal.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapi-macos-universal
          path: |
            bin/rapi-macos-universal.zip
            bin/rapi-macos-universal.zip.sha256
          if-no-files-found: error

  windows-exe:
    name: Windows (exe, x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build windows exe
        run: wails3 task windows:build

      - name: Zip exe
        shell: pwsh
        run: |
          $out = "bin/rapi-windows-x86_64.zip"
          Compress-Archive -Path "bin/rapi.exe" -DestinationPath $out
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  rapi-windows-x86_64.zip" | Out-File -Encoding ascii "bin/rapi-windows-x86_64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapi-windows-x86_64
          path: |
            bin/rapi-windows-x86_64.zip
            bin/rapi-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [linux-deb, linux-appimage, macos-app, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            # semver pre-release suffix (e.g. -alpha.1) => mark as pre-release
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=v0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          NOTES="Desktop builds of rAPI.

          - \`rapi_*.deb\` — Debian/Ubuntu (amd64, GTK4 + WebKitGTK 6.0); install with \`sudo apt install ./rapi_*.deb\`
          - \`rapi-x86_64.AppImage\` — portable Linux build (x86_64); \`chmod +x\` and run. Requires FUSE (\`libfuse2\`), or extract with \`--appimage-extract\`.
          - \`rapi-macos-universal.zip\` — macOS (Apple Silicon + Intel). Unsigned: on first launch right-click → Open, or allow it in System Settings → Privacy & Security.
          - \`rapi-windows-x86_64.zip\` — Windows 10/11 (x86_64). Unzip and run \`rapi.exe\` (uses the system WebView2 runtime).

          Requires the git CLI; the vault is your own git repo."
          gh release create "$TAG" \
            --title "rAPI $TAG" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            $PRERELEASE \
            artifacts/*.deb artifacts/*.AppImage artifacts/rapi-macos-universal.zip artifacts/*.sha256 artifacts/rapi-windows-x86_64.zip \
            || gh release upload "$TAG" --clobber artifacts/*.deb artifacts/*.AppImage artifacts/rapi-macos-universal.zip artifacts/*.sha256 artifacts/rapi-windows-x86_64.zip
