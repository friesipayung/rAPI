name: Version tag

# Creates the git tag for the version declared in internal/version.
# Bump `version.Version`, push to main, and this workflow tags the commit.
#
# The tag is created and pushed with the bot PAT (FRNDLY_BOT_TOKEN), NOT
# GITHUB_TOKEN, and no release dispatch happens: the tag push itself is
# what triggers the Build & Release workflow. Verified on 2026-11-21: a
# tag pushed by GITHUB_TOKEN followed by workflow_dispatch --ref <tag>
# fails the release job with 403 "Resource not accessible by integration"
# (3x reproduced), while the same tag pushed by the bot triggers a fully
# successful release run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "internal/version/version.go"

permissions: {}

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version from code
        id: ver
        run: |
          VERSION="$(go run ./cmd/version)"
          case "$VERSION" in
            v*|V*) echo "version constant must not start with v" >&2; exit 1;;
          esac
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create and push tag
        env:
          BOT_TOKEN: ${{ secrets.FRNDLY_BOT_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi
          git config user.name "frndly-bot"
          git config user.email "frndly-bot@users.noreply.github.com"
          git tag -a "${TAG}" -m "rAPI ${TAG}" "${GITHUB_SHA}"
          git push "https://x-access-token:${BOT_TOKEN}@github.com/friesipayung/rAPI.git" "refs/tags/${TAG}"
